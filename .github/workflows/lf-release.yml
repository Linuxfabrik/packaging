name: 'Linuxfabrik: 40 - Release'

# Builds every package changed on main and publishes the result as a GitHub
# prerelease `<package>-<version>-<iteration>`. The prerelease is the `testing`
# channel; `lf-promote.yml` turns it into a full release (the `release` channel)
# after seven days unless someone rejects it. The repository server pulls,
# verifies, signs and publishes the packages on its own (build/publish.sh), so
# no signing key ever reaches GitHub.
#
# The iteration counts up per version: the first build of a version is 1, every
# later change to the same package directory without a version bump (e.g. a
# recipe fix) builds iteration 2, 3, ...

on:
  push:
    branches:
      - 'main'
    paths:
      - 'packages/**'
  workflow_dispatch:
    inputs:
      package:
        description: 'Name of the package to rebuild and release, matching a directory under `packages/` (e.g. `glances`). Creates the next iteration of its current version.'
        required: true

permissions:
  contents: 'read'

# Two runs computing the next iteration at the same time would pick the same tag.
concurrency:
  group: 'lf-release'
  cancel-in-progress: false

jobs:
  prepare:
    runs-on:
      - 'ubuntu-24.04'
    outputs:
      builds: '${{ steps.releases.outputs.builds }}'
      releases: '${{ steps.releases.outputs.releases }}'
    steps:
      - name: 'Harden the runner (Audit all outbound calls)'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          egress-policy: 'audit'

      - name: 'git clone https://github.com/Linuxfabrik/packaging'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          # the full history and all tags, for the diff and the iteration count
          fetch-depth: 0

      - id: 'releases'
        env:
          BEFORE_SHA: '${{ github.event.before }}'
          INPUT_PACKAGE: '${{ inputs.package }}'
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            if [ ! -f "packages/$INPUT_PACKAGE/package.conf" ]; then
              echo "Unknown package: $INPUT_PACKAGE" >&2
              exit 1
            fi
            names="$INPUT_PACKAGE"
          else
            names="$(bash build/changed-packages.sh "$BEFORE_SHA" "$GITHUB_SHA")"
          fi

          # releases: one per package. builds: one per package and architecture
          # (PKG_ARCHES, default x86_64); the release job collects all
          # architectures of a package into its one release.
          builds='[]'
          releases='[]'
          for name in $names; do
            # shellcheck source=/dev/null
            version="$(source "packages/$name/package.conf" && echo "$PKG_VERSION")"
            # shellcheck source=/dev/null
            arches="$(source "packages/$name/package.conf" && echo "${PKG_ARCHES:-x86_64}")"
            last="$(git tag --list "$name-$version-*" \
                | sed "s/^$name-$version-//" \
                | grep --extended-regexp '^[0-9]+$' \
                | sort --numeric-sort \
                | tail -1)" || true
            iteration=$(( ${last:-0} + 1 ))
            releases="$(jq --compact-output \
                --arg name "$name" --arg version "$version" --arg iteration "$iteration" \
                '. + [{package: $name, version: $version, iteration: $iteration}]' <<< "$releases")"
            for arch in $arches; do
              builds="$(jq --compact-output \
                  --arg name "$name" --arg arch "$arch" --arg iteration "$iteration" \
                  '. + [{package: $name, arch: $arch, iteration: $iteration}]' <<< "$builds")"
            done
          done
          echo "Builds: $builds"
          echo "Releases: $releases"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  build:
    needs: 'prepare'
    if: "needs.prepare.outputs.builds != '[]'"
    strategy:
      fail-fast: false
      matrix:
        include: '${{ fromJson(needs.prepare.outputs.builds) }}'
    uses: './.github/workflows/lf-build-linux.yml'
    with:
      arch: '${{ matrix.arch }}'
      package: '${{ matrix.package }}'
      package-iteration: '${{ matrix.iteration }}'

  release:
    needs:
      - 'build'
      - 'prepare'
    strategy:
      fail-fast: false
      matrix:
        include: '${{ fromJson(needs.prepare.outputs.releases) }}'
    runs-on:
      - 'ubuntu-24.04'
    permissions:
      attestations: 'write'
      contents: 'write'
      id-token: 'write'
    env:
      TAG: '${{ matrix.package }}-${{ matrix.version }}-${{ matrix.iteration }}'
    steps:
      - name: 'Harden the runner (Audit all outbound calls)'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          egress-policy: 'audit'

      - name: 'Download the built packages'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          path: '${{ runner.temp }}/artifacts'
          # all architectures; the step below keeps only this package's artifacts
          pattern: '${{ matrix.package }}-*'

      # Release assets are a flat list, so the distro each file was built for goes
      # into SHA256SUMS as its directory (`<sha256>  <distro>/<file>`). The
      # repository server maps the downloaded assets back by checksum, which also
      # survives GitHub renaming an asset. Architecture and distro come from the
      # artifact name `<package>-<arch>-<distro>`; inside the artifact the files
      # sit one level down, in <distro>/, as matrix-package.sh collects them,
      # hence the `find`. The exact match on the name matters: the download
      # pattern `glances-*` would also take the artifacts of a package called
      # `glances-foo`.
      - name: 'Collect the assets and write SHA256SUMS'
        env:
          ARTIFACTS: '${{ runner.temp }}/artifacts'
          ASSETS: '${{ runner.temp }}/assets'
          PACKAGE: '${{ matrix.package }}'
        run: |
          mkdir "$ASSETS"
          for dir in "$ARTIFACTS"/*/; do
            artifact="$(basename "$dir")"
            if [[ ! "$artifact" =~ ^"$PACKAGE"-(aarch64|x86_64)-([a-z]+-v[0-9]+)$ ]]; then
              continue
            fi
            distro="${BASH_REMATCH[2]}"
            while IFS= read -r -d '' file; do
              name="$(basename "$file")"
              if [ -e "$ASSETS/$name" ]; then
                # also hits a noarch package built for two architectures
                echo "Two builds produced the same file name: $name" >&2
                exit 1
              fi
              cp "$file" "$ASSETS/$name"
              echo "$(sha256sum "$file" | cut --delimiter=' ' --fields=1)  $distro/$name" >> "$ASSETS/SHA256SUMS"
            done < <(find "$dir" -type f -print0)
          done
          if [ ! -s "$ASSETS/SHA256SUMS" ]; then
            echo "No packages found in $ARTIFACTS" >&2
            exit 1
          fi
          cat "$ASSETS/SHA256SUMS"

      - name: 'Attest the build provenance'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8' # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/assets/*'

      - name: 'Create the GitHub prerelease (testing channel)'
        env:
          ASSETS: '${{ runner.temp }}/assets'
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          PACKAGE: '${{ matrix.package }}'
          VERSION: '${{ matrix.version }}-${{ matrix.iteration }}'
        run: |
          gh release create "$TAG" \
              --notes "Built from $GITHUB_SHA. Published to the \`testing\` channel, promoted to \`release\` after 7 days unless rejected. Promote or reject it now with \`gh workflow run lf-promote.yml --repo $GITHUB_REPOSITORY --field release=$TAG --field action=promote|reject\`." \
              --prerelease \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$PACKAGE $VERSION" \
              "$ASSETS"/*
