name: 'Linuxfabrik: 20 - Build changed packages'

# Builds and smoke-tests every package a pull request touches, so that an
# upstream bump is only merged once it builds and installs on all its target
# distros. A change below build/ rebuilds every package.
#
# No `paths` filter on purpose: the `Build result` job is a required check, and a
# required check whose workflow never starts keeps every other pull request
# blocked.

on:
  pull_request: {}

permissions:
  contents: 'read'

jobs:
  changed-packages:
    runs-on:
      - 'ubuntu-24.04'
    outputs:
      builds: '${{ steps.changed.outputs.builds }}'
    steps:
      - name: 'Harden the runner (Audit all outbound calls)'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          egress-policy: 'audit'

      - name: 'git clone https://github.com/Linuxfabrik/packaging'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 0

      - id: 'changed'
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |
          # One build per package and architecture (PKG_ARCHES, default x86_64).
          # Assigned first, so a failing script stops the step (bash -e) instead
          # of yielding an empty list that would let "Build result" pass.
          names="$(bash build/changed-packages.sh --include-build "$BASE_SHA" "$HEAD_SHA")"
          builds='[]'
          for name in $names; do
            # shellcheck source=/dev/null
            arches="$(source "packages/$name/package.conf" && echo "${PKG_ARCHES:-x86_64}")"
            for arch in $arches; do
              builds="$(jq --compact-output --arg name "$name" --arg arch "$arch" \
                  '. + [{package: $name, arch: $arch}]' <<< "$builds")"
            done
          done
          echo "Builds: $builds"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  build:
    needs: 'changed-packages'
    if: "needs.changed-packages.outputs.builds != '[]'"
    strategy:
      fail-fast: false
      matrix:
        include: '${{ fromJson(needs.changed-packages.outputs.builds) }}'
    uses: './.github/workflows/lf-build-linux.yml'
    with:
      arch: '${{ matrix.arch }}'
      package: '${{ matrix.package }}'

  # One stable check name for the ruleset, whatever packages the matrix covers.
  # A skipped build (nothing to build) counts as success.
  build-result:
    name: 'Build result'
    needs:
      - 'build'
      - 'changed-packages'
    if: 'always()'
    runs-on:
      - 'ubuntu-24.04'
    steps:
      - name: 'Harden the runner (Audit all outbound calls)'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          egress-policy: 'audit'

      - env:
          BUILD_RESULT: '${{ needs.build.result }}'
          CHANGED_RESULT: '${{ needs.changed-packages.result }}'
        run: |
          echo "changed-packages: $CHANGED_RESULT, build: $BUILD_RESULT"
          [ "$CHANGED_RESULT" = 'success' ]
          [ "$BUILD_RESULT" = 'success' ] || [ "$BUILD_RESULT" = 'skipped' ]
