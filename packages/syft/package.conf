# Build manifest for syft. Sourced by build/create-package.sh.
#
# Syft, the SBOM generator for filesystems and container images by Anchore. A
# static Go binary, so it runs on every target; files/build-syft.sh builds it
# with Go from go.dev, because the distributions ship an older Go than
# anchore/syft requires. Packages that existed (checked 2026-11-24): upstream's
# own RPM and DEB on the GitHub release (binary only, no completions, no license
# texts of the linked Go modules), openSUSE Leap 15.6 (1.19.0, backports) and 16
# (1.45.0); none in Fedora, EL 8 to 10, EPEL, SLES, Debian or Ubuntu. The recipes
# follow upstream's .goreleaser.yaml for the build and openSUSE's syft.spec for
# the shell completions. The package keeps upstream's name, so it updates hosts
# that installed upstream's own RPM or DEB. files/build-syft.sh turns off the
# check for new releases at anchore.io by default.

PKG_VERSION='1.57.2'

# Where build/check-upstream.sh looks for new versions: the latest GitHub
# release, tagged v<version>.
PKG_UPSTREAM_TYPE='github'
PKG_UPSTREAM_PROJECT='anchore/syft'

# Upstream source. The GitHub archive unpacks to syft-<version>/.
PKG_SOURCE_TARBALL="syft-${PKG_VERSION}.tar.gz"
PKG_SOURCE_URL="https://github.com/${PKG_UPSTREAM_PROJECT}/archive/v${PKG_VERSION}/${PKG_SOURCE_TARBALL}"

# RPM recipe and the EL/Fedora/SLES targets it is built for.
PKG_RPM_SPEC='rpm/syft.spec'
PKG_RPM_DISTROS='fedora-v44 rocky-v8 rocky-v9 rocky-v10 sles-v15 sles-v16'

# DEB recipe and the Debian/Ubuntu targets it is built for.
PKG_DEB_DEBIAN_DIR='deb/debian'
PKG_DEB_DISTROS='debian-v12 debian-v13 ubuntu-v2204 ubuntu-v2404 ubuntu-v2604'

# Run after installing the package into a fresh container, as user nobody: syft
# reports the packaged version and catalogs the package database of the
# container, which proves that the catalogers for rpm, dpkg and the SQLite rpmdb
# are linked in. podman exec sets no $HOME where nobody is missing from
# /etc/passwd (SLES 15), and syft keeps its cache below $HOME.
PKG_SMOKE_TEST="export HOME=\"\$(mktemp --directory)\" && syft version | grep --quiet '^Version: *${PKG_VERSION}\$' && syft scan dir:/ --quiet --select-catalogers os --exclude './proc/**' --exclude './sys/**' --output syft-table | grep --quiet --extended-regexp ' (rpm|deb) *\$'"
