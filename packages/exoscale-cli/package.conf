# Build manifest for exoscale-cli. Sourced by build/create-package.sh.
#
# exo, the command-line tool for the Exoscale cloud. A static Go binary, so it
# runs on every target; files/build-exo.sh builds it with Go from go.dev,
# because the distributions ship an older Go than exoscale/cli requires. The
# package keeps upstream's name, so it updates hosts that installed upstream's
# own RPM or DEB.

PKG_VERSION='1.103.2'

# Where build/check-upstream.sh looks for new versions: the latest GitHub
# release, tagged v<version>.
PKG_UPSTREAM_TYPE='github'
PKG_UPSTREAM_PROJECT='exoscale/cli'

# Upstream source. The GitHub archive unpacks to cli-<version>/ and contains
# the vendored Go modules.
PKG_SOURCE_TARBALL="exoscale-cli-${PKG_VERSION}.tar.gz"
PKG_SOURCE_URL="https://github.com/${PKG_UPSTREAM_PROJECT}/archive/v${PKG_VERSION}/${PKG_SOURCE_TARBALL}"

# RPM recipe and the EL/Fedora/SLES targets it is built for.
PKG_RPM_SPEC='rpm/exoscale-cli.spec'
PKG_RPM_DISTROS='fedora-v44 rocky-v8 rocky-v9 rocky-v10 sles-v15 sles-v16'

# DEB recipe and the Debian/Ubuntu targets it is built for.
PKG_DEB_DEBIAN_DIR='deb/debian'
PKG_DEB_DISTROS='debian-v12 debian-v13 ubuntu-v2204 ubuntu-v2404 ubuntu-v2604'

# Run after installing the package into a fresh container, as user nobody:
# exo starts and reports the packaged version.
# exo refuses to start without a home directory for its configuration, and
# podman exec sets no $HOME where nobody is missing from /etc/passwd (SLES 15).
PKG_SMOKE_TEST="HOME=\"\$(mktemp --directory)\" exo version | grep --fixed-strings '${PKG_VERSION}'"
