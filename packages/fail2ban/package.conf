# Build manifest for fail2ban. Sourced by build/create-package.sh.
# Keep PKG_VERSION in sync with the upstream release tag we package.

PKG_VERSION='1.1.1'

# Where build/check-upstream.sh looks for new versions: the latest GitHub
# release, tagged <version> without a prefix.
PKG_UPSTREAM_TYPE='github'
PKG_UPSTREAM_PROJECT='fail2ban/fail2ban'
PKG_UPSTREAM_TAG_PREFIX=''

# Upstream source. The release tarball is the GitHub archive of the tag, signed
# by the upstream maintainer; the recipe verifies it against the key in files/.
# The name of the signature changed between releases (fail2ban-1.1.0.tar.gz.asc,
# 1.1.1.tar.gz.asc). If a bump fails to fetch it, check the release assets.
PKG_SOURCE_TARBALL="fail2ban-${PKG_VERSION}.tar.gz"
PKG_SOURCE_URL="https://github.com/${PKG_UPSTREAM_PROJECT}/archive/${PKG_VERSION}/${PKG_SOURCE_TARBALL}"
PKG_SOURCE_SIGNATURE_URL="https://github.com/${PKG_UPSTREAM_PROJECT}/releases/download/${PKG_VERSION}/${PKG_VERSION}.tar.gz.asc"

# RPM recipe and the EL targets it is built for. EPEL ships fail2ban too, but
# lags behind the upstream by months.
PKG_RPM_SPEC='rpm/fail2ban.spec'
PKG_RPM_DISTROS='rocky-v8 rocky-v9 rocky-v10'

# Run after installing the package into a fresh container, as user nobody.
# Besides the start of the client, run the upstream test cases that check every
# installed filter in /etc/fail2ban against its sample log lines, so a release
# whose filters stop matching (or start matching too much) does not reach the
# hosts. The run has to cover at least ten of them, so a selection that
# matches nothing cannot pass. The test id reads `test (module.Class)` on
# Python 3.6 and 3.9 and `test (module.Class.test)` on 3.12, hence a pattern on
# the method name alone. The ZZZ-* cases are left out: they test filters of the
# test suite itself, which include common.conf by a path into the source tree
# and cannot load from an installed package.
PKG_SMOKE_TEST='fail2ban-client --version && out="$(fail2ban-testcases --no-network --fast "testSampleRegexs(?!ZZZ-)" 2>&1)"; rc=$?; echo "$out"; [ "$rc" -eq 0 ] && echo "$out" | grep --extended-regexp --quiet "^Ran [0-9]{2,} tests"'
