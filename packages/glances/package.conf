# Build manifest for glances. Sourced by build/create-package.sh.
# Keep PKG_VERSION in sync with the upstream release tag we package.

PKG_VERSION='4.5.8'

# Upstream source. PKG_GITHUB_USER/REPO are also used by the publishing step
# (mirror tool) to pick up the release assets.
PKG_GITHUB_USER='nicolargo'
PKG_GITHUB_REPO='glances'
PKG_SOURCE_TARBALL="glances-${PKG_VERSION}.tar.gz"
PKG_SOURCE_URL="https://github.com/${PKG_GITHUB_USER}/${PKG_GITHUB_REPO}/archive/v${PKG_VERSION}/${PKG_SOURCE_TARBALL}"

# RPM recipe and the EL/Fedora targets it is built for.
PKG_RPM_SPEC='rpm/glances.spec'
PKG_RPM_DISTROS='rocky-v10 fedora-v44'

# DEB recipe and the Debian/Ubuntu targets it is built for.
PKG_DEB_DEBIAN_DIR='deb/debian'
PKG_DEB_DISTROS='debian-v13 ubuntu-v2404'

# Run after installing the package into a fresh container, as user nobody.
# --version loads glances and psutil; the web UI dependencies (fastapi,
# uvicorn) are only imported with -w and are covered by the install alone.
PKG_SMOKE_TEST='glances --version'
