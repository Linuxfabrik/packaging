# Build manifest for glances. Sourced by build/create-package.sh.
#
# Distro-native: glances runs on the distribution's Python and libraries. Not
# targeted, checked 2026-11-24 against glances 4.5.9 (requires-python >= 3.10,
# which the code needs: dataclass fields annotated `float | None`):
# - EL 8 and 9: Python 3.6 and 3.9; their python3.11/3.12 stacks lack psutil,
#   defusedxml, fastapi and uvicorn, also in EPEL.
# - SLES 15: Python 3.6; python311 has psutil and jinja2, but SLE 15 ships no
#   fastapi or uvicorn for it.
# - Ubuntu 22.04: setuptools 59 predates the [project] table of pyproject.toml
#   (the build yields an UNKNOWN wheel), and fastapi 0.63 and uvicorn 0.15 are
#   below upstream's floor (fastapi >= 0.82).

# Keep PKG_VERSION in sync with the upstream release tag we package.

PKG_VERSION='4.5.9'

# Where build/check-upstream.sh looks for new versions: the latest GitHub
# release, tagged v<version>.
PKG_UPSTREAM_TYPE='github'
PKG_UPSTREAM_PROJECT='nicolargo/glances'

# Upstream source.
PKG_SOURCE_TARBALL="glances-${PKG_VERSION}.tar.gz"
PKG_SOURCE_URL="https://github.com/${PKG_UPSTREAM_PROJECT}/archive/v${PKG_VERSION}/${PKG_SOURCE_TARBALL}"

# RPM recipe and the EL/Fedora targets it is built for.
PKG_RPM_SPEC='rpm/glances.spec'
PKG_RPM_DISTROS='fedora-v44 fedora-v45 rocky-v10 sles-v16'

# DEB recipe and the Debian/Ubuntu targets it is built for.
PKG_DEB_DEBIAN_DIR='deb/debian'
PKG_DEB_DISTROS='debian-v12 debian-v13 ubuntu-v2404 ubuntu-v2604'

# Run after installing the package into a fresh container, as user nobody.
# --version loads glances and psutil. The web server (-w, what glances.service
# runs) imports fastapi and uvicorn only then, so the module is imported as
# well, with the interpreter from the shebang of glances: SLE 16 has no
# /usr/bin/python3, and Fedora's shebang carries flags (-sP), hence unquoted.
PKG_SMOKE_TEST='glances --version && $(head --lines=1 "$(command -v glances)" | cut --characters=3-) -c "import glances.outputs.glances_restful_api"'
