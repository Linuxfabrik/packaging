# Build manifest for wkhtmltox. Sourced by build/create-package.sh.
#
# wkhtmltopdf and wkhtmltoimage, which render HTML to PDF and images with
# QtWebKit, in the build "with patched qt" whose headers, footers, tables of
# contents and page breaks the distributions' builds against plain Qt 5 lack.
# Upstream archived wkhtmltopdf in 2022 and its packaging in 2023; the last
# release, 0.12.6.1-3, has RPMs up to EL 9. Packages that existed (checked
# 2026-11-26): upstream's RPMs for EL 8 and 9 and DEBs for Debian 11 and 12
# and Ubuntu 22.04 (patched Qt), Fedora 44 and 45, Debian 11 and 12, Ubuntu
# 22.04 and 24.04 0.12.6 (plain Qt); none for EL 10. The package therefore
# repacks upstream's EL 9 RPM for Rocky 10, where it installs and renders
# (checked 2026-11-26 on Rocky 10.1). It keeps upstream's name, epoch and
# paths below /usr/local, so it updates hosts that installed upstream's RPM and
# keeps every caller configured for /usr/local/bin/wkhtmltopdf working.
#
# QtWebKit gets no security fixes anymore. Render trusted HTML only.

PKG_VERSION='0.12.6.1'

# Archived upstream, nothing to watch.
PKG_UPSTREAM_TYPE='none'

# Upstream's EL 9 RPM for the architecture being built. The release of
# upstream's package (-3) goes into the release of this one, see the spec.
# PKG_ARCH is only set during a build; the other readers of this file do not
# need the source.
PKG_SOURCE_TARBALL="wkhtmltox-${PKG_VERSION}-3.almalinux9.${PKG_ARCH:-x86_64}.rpm"
PKG_SOURCE_URL="https://github.com/wkhtmltopdf/packaging/releases/download/${PKG_VERSION}-3/${PKG_SOURCE_TARBALL}"

# RPM recipe and the EL targets it is built for.
PKG_RPM_SPEC='rpm/wkhtmltox.spec'
PKG_RPM_DISTROS='rocky-v10'

# Run after installing the package into a fresh container, as user nobody: the
# packaged version reports the patched-Qt build and renders an HTML file with a
# footer, which plain Qt builds ignore with a warning, into a PDF.
PKG_SMOKE_TEST="cd \"\$(mktemp --directory)\" && wkhtmltopdf --version | grep --quiet --fixed-strings 'wkhtmltopdf ${PKG_VERSION} (with patched qt)' && echo '<h1>Linuxfabrik</h1>' > in.html && wkhtmltopdf --quiet --footer-center '[page]' in.html out.pdf && head --bytes=5 out.pdf | grep --quiet '^%PDF-'"
