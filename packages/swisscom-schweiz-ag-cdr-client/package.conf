# Build manifest for swisscom-schweiz-ag-cdr-client. Sourced by
# build/create-package.sh.
#
# The curaLINE Client of Swisscom, which exchanges documents with the curaLINE
# Document Routing (CDR) service of the Swiss healthcare system. It is built
# with Hydraulic Conveyor, which needs a commercial license and bundles a Java
# runtime, so the package repacks the linux-amd64 tarball from the Swisscom
# download page instead of building from source. The tarball holds the same
# files as Swisscom's own .deb (checked 2026-10-29). The package keeps the
# name and the paths of that .deb, so it updates hosts that installed it. It
# differs in a static service account instead of `DynamicUser=yes`, real
# configuration files below /etc instead of a symlink into /usr/lib, a root
# owned installation, and the UI split off into the -gui package.

PKG_VERSION='6.2.1'

# Where build/check-upstream.sh looks for new versions: the apt repository on
# the download page. The GitHub tags of swisscom/cdr-client run ahead of the
# download page, which only offers the latest version and removes the older
# ones.
PKG_UPSTREAM_TYPE='url'
PKG_UPSTREAM_URL='https://cdr.health.swisscom.ch/share/downloads/debian/Packages'
PKG_UPSTREAM_REGEX='^Version: \K[0-9.]+$'

# Upstream binary tarball. It unpacks to cdr-client-<version>/.
PKG_SOURCE_TARBALL="cdr-client-${PKG_VERSION}-linux-amd64.tar.gz"
PKG_SOURCE_URL="https://cdr.health.swisscom.ch/share/downloads/${PKG_SOURCE_TARBALL}"

# RPM recipe and the EL/Fedora/SLES targets it is built for. The UI needs
# glibc 2.34, so EL 8 and SLES 15 get the service only.
PKG_RPM_SPEC='rpm/swisscom-schweiz-ag-cdr-client.spec'
PKG_RPM_DISTROS='fedora-v44 rocky-v8 rocky-v9 rocky-v10 sles-v15 sles-v16'

# DEB recipe and the Debian/Ubuntu targets it is built for.
PKG_DEB_DEBIAN_DIR='deb/debian'
PKG_DEB_DISTROS='debian-v12 debian-v13 ubuntu-v2204 ubuntu-v2404 ubuntu-v2604'

# Swisscom only publishes the client for linux-amd64.
PKG_ARCHES='x86_64'

# Run after installing the package into a fresh container, as user nobody: the
# packaged version is installed, and the client starts, finds its configuration
# and stops because nobody may not read it.
PKG_SMOKE_TEST="test -f /usr/lib/swisscom-schweiz-ag/cdr-client/lib/app/cdr-client-service-${PKG_VERSION}-plain.jar && timeout 120 cdr-client-service 2>&1 | grep --fixed-strings 'exists but does not point to a readable, regular file'"
