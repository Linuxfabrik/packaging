# Build manifest for Nextcloud. Sourced by build/create-package.sh.
#
# Nextcloud server, laid out like the official Docker images: the release
# tarball below /var/www/html/nextcloud, the shipped apps read-only in apps/,
# apps from the app store in custom_apps/. Unlike the images, the code belongs
# to root; the web server user can only write config/, custom_apps/, data/ and
# .htaccess. The recipe is based on the Fedora/EPEL spec (subpackages per web
# server and database), but leaves the tarball unpatched, so the integrity check
# of Nextcloud stays clean.

PKG_VERSION='35.0.2'

# Where build/check-upstream.sh looks for new versions: the latest GitHub
# release of the server, tagged v<version>.
PKG_UPSTREAM_TYPE='github'
PKG_UPSTREAM_PROJECT='nextcloud/server'

# Upstream source: the release tarball including the bundled PHP libraries and
# the compiled frontend, which the GitHub archive lacks.
PKG_SOURCE_TARBALL="nextcloud-${PKG_VERSION}.tar.bz2"
PKG_SOURCE_URL="https://download.nextcloud.com/server/releases/${PKG_SOURCE_TARBALL}"
# Verified in %prep against files/nextcloud.asc, the key of Nextcloud Security
# (28806A878AE423A28372792ED75899B9A724937A), as in the official Docker images.
PKG_SOURCE_SIGNATURE_URL="${PKG_SOURCE_URL}.asc"

# RPM recipe and the EL targets it is built for. Nextcloud 35 needs PHP 8.3 to
# 8.5, RHEL 10 ships 8.3 and 8.4.
PKG_RPM_SPEC='rpm/nextcloud.spec'
PKG_RPM_DISTROS='rocky-v10'

# Run after installing the package into a fresh container, as user nobody: the
# installed release reports the packaged version.
PKG_SMOKE_TEST="php --run 'require \"/var/www/html/nextcloud/version.php\"; echo \$OC_VersionString, PHP_EOL;' | grep --line-regexp --fixed-strings '${PKG_VERSION}'"
