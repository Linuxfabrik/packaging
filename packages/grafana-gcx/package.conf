# Build manifest for grafana-gcx. Sourced by build/create-package.sh.
#
# gcx, the command-line tool for Grafana and Grafana Cloud. A static Go binary,
# so it runs on every target; files/build-gcx.sh builds it with Go from go.dev,
# because the distributions ship an older Go than grafana/gcx requires. Neither
# upstream nor Grafana's own repositories nor the distributions ship an RPM or
# DEB (checked 2026-10-27). The package is called grafana-gcx because `gcx` is
# taken in Debian and Ubuntu by an unrelated astronomy tool, which also installs
# /usr/bin/gcx. files/build-gcx.sh turns off the usage telemetry by default and
# the check for new releases on GitHub.

PKG_VERSION='1.7.1'

# Where build/check-upstream.sh looks for new versions: the latest GitHub
# release, tagged v<version>.
PKG_UPSTREAM_TYPE='github'
PKG_UPSTREAM_PROJECT='grafana/gcx'

# Upstream source. The GitHub archive unpacks to gcx-<version>/.
PKG_SOURCE_TARBALL="grafana-gcx-${PKG_VERSION}.tar.gz"
PKG_SOURCE_URL="https://github.com/${PKG_UPSTREAM_PROJECT}/archive/v${PKG_VERSION}/${PKG_SOURCE_TARBALL}"

# RPM recipe and the EL/Fedora/SLES targets it is built for.
PKG_RPM_SPEC='rpm/grafana-gcx.spec'
PKG_RPM_DISTROS='fedora-v44 rocky-v8 rocky-v9 rocky-v10 sles-v15 sles-v16'

# DEB recipe and the Debian/Ubuntu targets it is built for.
PKG_DEB_DEBIAN_DIR='deb/debian'
PKG_DEB_DISTROS='debian-v12 debian-v13 ubuntu-v2204 ubuntu-v2404 ubuntu-v2604'

# Run after installing the package into a fresh container, as user nobody: gcx
# starts and reports the packaged version. gcx stores its configuration below
# $HOME, which podman exec does not set where nobody is missing from
# /etc/passwd (SLES 15).
PKG_SMOKE_TEST="HOME=\"\$(mktemp --directory)\" gcx --version | grep --fixed-strings '${PKG_VERSION} built from'"
