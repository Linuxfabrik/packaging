# Build manifest for the Linuxfabrik Monitoring Plugins. Sourced by
# build/create-package.sh.
#
# One package, linuxfabrik-monitoring-plugins, with the plugins in
# /usr/lib64/nagios/plugins and their Python dependencies in a venv below
# /usr/lib64/linuxfabrik-monitoring-plugins, installed hash-pinned from the
# lockfiles/py3xx/ of the release. EL also gets
# linuxfabrik-monitoring-plugins-selinux. Not distro-native on purpose: the
# plugins need dependency versions that no target distribution ships, and the
# venv keeps them identical on every target. The targets follow ROADMAP.md of
# the monitoring-plugins repository.

PKG_VERSION='8.1.0'

# Where build/check-upstream.sh looks for new versions: the latest GitHub
# release, tagged v<version>.
PKG_UPSTREAM_TYPE='github'
PKG_UPSTREAM_PROJECT='Linuxfabrik/monitoring-plugins'

# Upstream source. The GitHub archive unpacks to monitoring-plugins-<version>/.
PKG_SOURCE_TARBALL="monitoring-plugins-${PKG_VERSION}.tar.gz"
PKG_SOURCE_URL="https://github.com/${PKG_UPSTREAM_PROJECT}/archive/v${PKG_VERSION}/${PKG_SOURCE_TARBALL}"

# RPM recipe and the EL/SLES targets it is built for.
PKG_RPM_SPEC='rpm/linuxfabrik-monitoring-plugins.spec'
PKG_RPM_DISTROS='rocky-v8 rocky-v9 rocky-v10 sles-v15 sles-v16'

# DEB recipe and the Debian/Ubuntu targets it is built for.
PKG_DEB_DEBIAN_DIR='deb/debian'
PKG_DEB_DISTROS='debian-v11 debian-v12 debian-v13 ubuntu-v2204 ubuntu-v2404 ubuntu-v2604'

# Run after installing the packages into a fresh container, as user nobody:
# every .pyc in the venv loads and every plugin starts.
PKG_SMOKE_TEST='bash /files/smoke-test.sh'
