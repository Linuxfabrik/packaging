# Build manifest for FirewallFabrik. Sourced by build/create-package.sh.
#
# Built distro-native as two packages from one source: linuxfabrik-firewallfabrik
# (core and the fwf-ipt, fwf-nft and fwf-upgrade compilers) and
# linuxfabrik-firewallfabrik-gui (the Qt GUI, fwf). Targets are the distros that
# ship Python >= 3.11, SQLAlchemy >= 2.0 and PySide6 >= 6.8 (verified
# 2026-10-25); EL 8/9, Debian 12 and Ubuntu 22.04/24.04 ship SQLAlchemy 1.x
# and no PySide6.

PKG_VERSION='3.6.0'

# Where build/check-upstream.sh looks for new versions: the latest GitHub
# release, tagged v<version>.
PKG_UPSTREAM_TYPE='github'
PKG_UPSTREAM_PROJECT='Linuxfabrik/firewallfabrik'

# Upstream source.
PKG_SOURCE_TARBALL="firewallfabrik-${PKG_VERSION}.tar.gz"
PKG_SOURCE_URL="https://github.com/${PKG_UPSTREAM_PROJECT}/archive/v${PKG_VERSION}/${PKG_SOURCE_TARBALL}"

# RPM recipe and the EL/Fedora targets it is built for.
PKG_RPM_SPEC='rpm/firewallfabrik.spec'
PKG_RPM_DISTROS='fedora-v44 rocky-v10'

# DEB recipe and the Debian/Ubuntu targets it is built for.
PKG_DEB_DEBIAN_DIR='deb/debian'
PKG_DEB_DISTROS='debian-v13 ubuntu-v2604'

# Run after installing both packages into a fresh container, as user nobody:
# compile the shipped example for one nftables and one iptables firewall, and
# load the GUI including PySide6 (fwf --version imports it before it parses
# the arguments).
PKG_SMOKE_TEST='example=/usr/share/linuxfabrik-firewallfabrik/examples/vdc.fwf; out="$(mktemp --directory)"; fwf-nft --file "$example" --destdir "$out" firewall && fwf-ipt --file "$example" --destdir "$out" infra && ls -l "$out" && fwf --version'
