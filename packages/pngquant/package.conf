# Build manifest for pngquant. Sourced by build/create-package.sh.
#
# pngquant, the lossy PNG compressor. Packages that existed (checked
# 2026-11-26): EPEL 2.12.5 on EL 8 and 2.17.0 on EL 9, Fedora 44 and 45 2.18.0,
# SLES 16 2.18.0, Debian 11 2.13.1, 12 2.17.0 and 13 2.18.0, Ubuntu 22.04
# 2.13.1, 24.04 and 26.04 2.18.0; none in EL 10 or EPEL 10, which only has
# libimagequant. The package therefore targets Rocky 10 only. The recipe is
# Fedora's spec, built against libimagequant from EPEL 10, and keeps the package
# name, so a later EPEL 10 build updates it.

PKG_VERSION='2.18.0'

# Upstream continues as pngquant 3, a rewrite in Rust that no distribution ships
# and that Fedora's spec cannot build. The package stays on the C version 2.18,
# as every distribution does, so nothing is watched here: a tag watch would open
# a bump to 3.x right away. Bump by hand when Fedora does.
PKG_UPSTREAM_TYPE='none'

# Upstream source. The GitHub archive unpacks to pngquant-<version>/.
PKG_SOURCE_TARBALL="pngquant-${PKG_VERSION}.tar.gz"
PKG_SOURCE_URL="https://github.com/kornelski/pngquant/archive/${PKG_VERSION}/${PKG_SOURCE_TARBALL}"

# RPM recipe and the EL targets it is built for.
PKG_RPM_SPEC='rpm/pngquant.spec'
PKG_RPM_DISTROS='rocky-v10'

# Run after installing the package into a fresh container, as user nobody:
# pngquant turns a 4x4 truecolor PNG into a palette PNG (a PLTE chunk). Its
# --version names the version of libimagequant it was built against, not its
# own, as in Fedora, so the version is not checked.
PKG_SMOKE_TEST="cd \"\$(mktemp --directory)\" && echo 'iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAJ0lEQVR4nAXBMQEAAACCMIIZzJNQBnQDDBaHEBMbF6Gmtq7CzOzcPKdjE0EdpVEhAAAAAElFTkSuQmCC' | base64 --decode > in.png && pngquant --output out.png in.png && grep --quiet PLTE out.png"
