# Build manifest for acme.sh. Sourced by build/create-package.sh.
#
# A POSIX shell script with its dnsapi, deploy and notify hooks, so one noarch
# package serves every target. Laid out like the Debian package: the script
# below /usr/share/acme.sh, /usr/bin/acme.sh sets ACME_PACKAGED, which turns
# off the self-upgrade of acme.sh. Debian 13 and Ubuntu 26.04 ship an older
# acme.sh; this one replaces it where the Linuxfabrik repository is enabled.

PKG_VERSION='3.1.6'

# Where build/check-upstream.sh looks for new versions: the latest GitHub
# release, tagged <version> without a prefix. Since 3.1.6 upstream also signs
# the release tags (allowed_signers in the source).
PKG_UPSTREAM_TYPE='github'
PKG_UPSTREAM_PROJECT='acmesh-official/acme.sh'
PKG_UPSTREAM_TAG_PREFIX=''

# Upstream source.
PKG_SOURCE_TARBALL="acme.sh-${PKG_VERSION}.tar.gz"
PKG_SOURCE_URL="https://github.com/${PKG_UPSTREAM_PROJECT}/archive/${PKG_VERSION}/${PKG_SOURCE_TARBALL}"

# RPM recipe and the EL/Fedora/SLES targets it is built for.
PKG_RPM_SPEC='rpm/acme.sh.spec'
PKG_RPM_DISTROS='fedora-v44 rocky-v8 rocky-v9 rocky-v10 sles-v15 sles-v16'

# DEB recipe and the Debian/Ubuntu targets it is built for.
PKG_DEB_DEBIAN_DIR='deb/debian'
PKG_DEB_DISTROS='debian-v12 debian-v13 ubuntu-v2204 ubuntu-v2404 ubuntu-v2604'

# Run after installing the package into a fresh container, as user nobody:
# acme.sh starts and reports the packaged version, and refuses to upgrade
# itself. HOME: podman exec sets none where nobody is missing from /etc/passwd
# (SLES 15), and acme.sh needs one for its default config home.
PKG_SMOKE_TEST="export HOME=\"\$(mktemp --directory)\"; acme.sh --version | grep --fixed-strings 'v${PKG_VERSION}' && acme.sh --upgrade 2>&1 | grep --fixed-strings 'managed by the system package manager'"
