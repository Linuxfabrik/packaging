# Build manifest for linuxfabrik-release. Sourced by build/create-package.sh.
#
# The repository configuration and the signing key for repo.linuxfabrik.ch,
# like epel-release for EPEL. Built per distro, because the repository path
# (and on Debian/Ubuntu the codename) is written into the configuration at
# build time.

PKG_VERSION='1'

# No upstream: the source lives in src/ and is packed by create-package.sh.
# Any change below packages/linuxfabrik-release/ builds the next iteration.
PKG_UPSTREAM_TYPE='none'
PKG_SOURCE_DIR='src'
PKG_SOURCE_TARBALL="linuxfabrik-release-${PKG_VERSION}.tar.gz"

# RPM recipe and the EL/Fedora/SLES targets it is built for.
PKG_RPM_SPEC='rpm/linuxfabrik-release.spec'
PKG_RPM_DISTROS='fedora-v44 rocky-v8 rocky-v9 rocky-v10 sles-v15 sles-v16'

# DEB recipe and the Debian/Ubuntu targets it is built for.
PKG_DEB_DEBIAN_DIR='deb/debian'
PKG_DEB_DISTROS='debian-v11 debian-v12 debian-v13 ubuntu-v2204 ubuntu-v2404 ubuntu-v2604'

# Run after installing the package into a fresh container, as user nobody:
# print the installed configuration into the build log, and fail if it does not
# point to repo.linuxfabrik.ch or still holds a placeholder.
PKG_SMOKE_TEST='conf="$(cat /etc/yum.repos.d/linuxfabrik.repo /etc/zypp/repos.d/linuxfabrik.repo /etc/apt/sources.list.d/linuxfabrik.sources 2>/dev/null)"; echo "$conf"; grep --quiet "https://repo.linuxfabrik.ch/" <<< "$conf" && ! grep "@" <<< "$conf"'
